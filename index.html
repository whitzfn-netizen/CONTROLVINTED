    </div>
    <div class="modal-f"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">${editing ? 'Guardar cambios' : 'Añadir deuda'}</button></div></form>`,
    { onClose: back ? () => openDebtDetail(id) : null });
  const form = $('#debtForm', root);
  const setErr = (f, msg) => { const g = form.querySelector(`[data-f="${f}"]`); g.classList.toggle('bad', !!msg); g.querySelector('.err').textContent = msg || ''; };
  const preview = () => {
    const o = parseMoney($('#df-original').value), p = parseMoney($('#df-paid').value);
    $('#df-left').textContent = o === null || p === null ? '—' : money(Math.max(0, o - p));
  };
  preview();
  form.addEventListener('input', e => { if (e.target.matches('#df-original,#df-paid')) preview(); const g = e.target.closest('.fg.bad'); if (g) setErr(g.dataset.f, ''); });
  form.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeLayer(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    $$('.fg.bad', form).forEach(g => setErr(g.dataset.f, ''));
    const name = $('#df-name').value.trim().replace(/\s+/g, ' ');
    const reason = $('#df-reason').value.trim();
    const original = parseMoney($('#df-original').value), paidIn = parseMoney($('#df-paid').value);
    const createdOn = DATE_RE.test($('#df-created').value) ? $('#df-created').value : today();
    const dueDate = DATE_RE.test($('#df-due').value) ? $('#df-due').value : '';
    let bad = null;
    const fail = (f, m) => { setErr(f, m); bad ||= f; };
    if (!name) fail('name', 'Escribe el nombre de la persona');
    if (original === null) fail('original', 'Importe no válido. Ej.: 25,50');
    else if (!original) fail('original', 'Indica cuánto te debe');
    if (paidIn === null) fail('paid', 'Importe no válido. Ej.: 10,00');
    else if (original && paidIn > original) fail('paid', 'No puede superar la cantidad original');
    if (dueDate && dueDate < createdOn) fail('dueDate', 'No puede ser anterior a la fecha de creación');
    if (bad) { form.querySelector(`[data-f="${bad}"] .field`).focus(); return; }
    const now = new Date().toISOString();
    const cur = editing ? Debts.items.get(editing.id) || editing : null;
    const payments = cur ? [...(cur.payments || [])] : [];
    const had = cur ? paidOf(cur) : 0;
    if (!cur && paidIn > 0) payments.push({ id: rid('p'), date: createdOn, amount: paidIn, note: 'Pagado al crear la deuda', at: now });
    if (cur && paidIn !== had) payments.push({ id: rid('p'), date: today(), amount: paidIn - had, note: 'Ajuste al editar la deuda', at: now, adjust: true });
    const rec = settle({ ...(cur || {}), id: cur ? cur.id : rid('d'), name, reason, original, payments, createdOn, dueDate, notes: $('#df-notes').value.trim(), createdAt: cur?.createdAt || now, updatedAt: now });
    const btn = form.querySelector('[type="submit"]'); btn.disabled = true;
    try {
      await Debts.put(rec);
      closeLayer();
      toast(cur ? 'Deuda actualizada' : pendingOf(rec) ? 'Deuda añadida' : 'Deuda añadida y marcada como pagada');
    } catch (err) { btn.disabled = false; toast(errMsg(err), true); }
  });
}

/* ---------- Registrar pago ---------- */
function openPayment(id, back) {
  const d = Debts.items.get(id); if (!d) return;
  const pend = pendingOf(d);
  const root = openLayer(`<form class="modal narrow" id="payForm" novalidate aria-labelledby="pyT">
    <div class="modal-h"><h2 id="pyT">Registrar pago</h2><button class="icon-btn sm" type="button" data-close aria-label="Cerrar">${ICON.x}</button></div>
    <div class="modal-b">
      <p style="margin:0;color:var(--fg-2)"><b style="color:var(--fg)">${esc(d.name)}</b> te debe <b class="c-o">${money(pend)}</b> de ${money(d.original)}${d.reason ? ` · ${esc(d.reason)}` : ''}.</p>
      <div class="fg" data-f="amount"><label for="py-amount">Cantidad que te ha pagado</label><div class="money-in"><input class="field" id="py-amount" inputmode="decimal" placeholder="0,00" autocomplete="off" autofocus><span>€</span></div><span class="err"></span></div>
      <div class="row"><button class="btn sm" type="button" data-fill="${pend}">Lo paga todo (${money(pend)})</button>${pend >= 2 ? `<button class="btn sm ghost" type="button" data-fill="${Math.round(pend / 2)}">La mitad (${money(Math.round(pend / 2))})</button>` : ''}</div>
      <div class="grid2">
        <div class="fg"><label for="py-date">Fecha del pago</label><input class="field" type="date" id="py-date" value="${today()}"></div>
        <div class="fg"><label for="py-note">Nota <span class="muted">(opcional)</span></label><input class="field" id="py-note" maxlength="120" autocomplete="off" placeholder="Bizum, efectivo…"></div>
      </div>
      <div class="preview-total"><span>Quedará pendiente</span><b id="py-left">${money(pend)}</b></div>
    </div>
    <div class="modal-f"><button class="btn ghost" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Guardar pago</button></div></form>`,
    { onClose: back ? () => openDebtDetail(id) : null });
  const form = $('#payForm', root), g = form.querySelector('[data-f="amount"]');
  const setErr = m => { g.classList.toggle('bad', !!m); g.querySelector('.err').textContent = m || ''; };
  const preview = () => { const v = parseMoney($('#py-amount').value); $('#py-left').textContent = v === null ? '—' : money(Math.max(0, pend - v)); };
  form.addEventListener('input', e => { if (e.target.id === 'py-amount') { setErr(''); preview(); } });
  form.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) return closeLayer();
    const f = e.target.closest('[data-fill]');
    if (f) { $('#py-amount').value = moneyPlain(Number(f.dataset.fill)); setErr(''); preview(); $('#py-amount').focus(); }
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const cur = Debts.items.get(id); if (!cur) return closeLayer();
    const left = pendingOf(cur), amount = parseMoney($('#py-amount').value);
    if (amount === null) { setErr('Importe no válido. Ej.: 10,00'); return $('#py-amount').focus(); }
    if (!amount) { setErr('Indica cuánto te ha pagado'); return $('#py-amount').focus(); }
    if (amount > left) { setErr(`Solo quedan ${money(left)} pendientes`); return $('#py-amount').focus(); }
    const now = new Date().toISOString();
    const date = DATE_RE.test($('#py-date').value) ? $('#py-date').value : today();
    const rec = settle({ ...cur, payments: [...(cur.payments || []), { id: rid('p'), date, amount, note: $('#py-note').value.trim(), at: now }], updatedAt: now });
    const btn = form.querySelector('[type="submit"]'); btn.disabled = true;
    try {
      await Debts.put(rec);
      closeLayer();
      toast(pendingOf(rec) ? `Pago registrado · quedan ${money(pendingOf(rec))}` : 'Deuda saldada: marcada como pagada');
    } catch (err) { btn.disabled = false; toast(errMsg(err), true); }
  });
}

/* ---------- Ficha de la deuda ---------- */
function openDebtDetail(id) {
  if (!Debts.items.has(id)) return;
  DUI.detailId = id;
  const root = openLayer(`<aside class="drawer" id="debtDrawer" role="dialog" aria-modal="true" aria-labelledby="ddT"></aside>`, { drawer: true, onClose: () => { DUI.detailId = null; } });
  renderDebtDetail();
  $('#debtDrawer').addEventListener('click', e => {
    const b = e.target.closest('[data-da],[data-close]'); if (!b) return;
    if (b.hasAttribute('data-close')) return closeLayer();
    const cur = DUI.detailId, act = b.dataset.da;
    if (act === 'pay') openPayment(cur, true);
    if (act === 'edit') openDebtForm(cur, true);
    if (act === 'delete') confirmDebtDelete(cur, true);
    if (act === 'del-pay') confirmPaymentDelete(cur, b.dataset.pid);
  });
  $('#debtDrawer [data-close]')?.focus();
  return root;
}
function renderDebtDetail() {
  const el = $('#debtDrawer'); if (!el) return;
  const d = Debts.items.get(DUI.detailId);
  if (!d) { closeLayer(); return; }
  const s = debtStatus(d), st = DST[s], paid = paidOf(d), pend = pendingOf(d), due = dueInfo(d);
  const pct = d.original ? Math.min(100, paid / d.original * 100) : 0;
  const pays = [...(d.payments || [])].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.at || '').localeCompare(a.at || ''));
  const scroll = el.scrollTop;
  el.innerHTML = `
    <div class="modal-h"><h2 id="ddT">Ficha de deuda</h2><button class="icon-btn sm" type="button" data-close aria-label="Cerrar">${ICON.x}</button></div>
    <div class="modal-b">
      <div class="d-hero">${debtAvatar(d, s)}<div style="min-width:0;display:flex;flex-direction:column;gap:6px">
        <p class="nm">${esc(d.name)}</p>${d.reason ? `<span style="color:var(--fg-2)">${esc(d.reason)}</span>` : ''}
        <div class="row" style="gap:6px"><span class="pill-static t-${st.t}">${st.label}</span></div></div></div>
      <div class="figs">
        <div class="fig total"><span class="l">Pendiente de cobrar</span><span class="v ${pend ? 'c-o' : 'c-g'}">${money(pend)}</span><div class="split" aria-hidden="true"><span class="w" style="width:${pct}%"></span><span class="p" style="width:${100 - pct}%"></span></div><span class="l">${Math.round(pct)} % cobrado</span></div>
        <div class="fig"><span class="l">Cantidad original</span><span class="v">${money(d.original)}</span></div>
        <div class="fig"><span class="l">Pagado</span><span class="v c-g">${money(paid)}</span></div>
      </div>
      <div class="d-sec"><h4>Fechas</h4>
        <dl class="kv"><dt>Fecha de creación</dt><dd class="num">${fmtDate(d.createdOn)}</dd>
        <dt>Fecha límite</dt><dd class="num ${due.cls}">${d.dueDate ? esc(due.txt) : '—'}</dd>
        ${d.paidAt ? `<dt>Saldada</dt><dd class="num c-g">${fmtDate(d.paidAt)}</dd>` : ''}
        <dt>Última modificación</dt><dd class="num">${d.updatedAt ? esc(fmtDateTime(d.updatedAt)) : '—'}</dd></dl>
      </div>
      <div class="d-sec"><h4>Pagos (${pays.length})</h4>
        ${pays.length ? `<ul class="timeline">${pays.map(p => `<li><div class="pay-row"><div><b class="${p.amount < 0 ? 'c-r' : 'c-g'}">${p.amount < 0 ? '−' : '+'}${money(Math.abs(p.amount))}</b> <span class="when">${fmtDate(p.date)}</span>${p.note ? `<div class="chg">${esc(p.note)}</div>` : ''}</div>
          <button class="icon-btn sm del" type="button" data-da="del-pay" data-pid="${esc(p.id)}" aria-label="Eliminar el pago de ${money(Math.abs(p.amount))} del ${fmtDate(p.date)}" title="Eliminar pago">${ICON.trash}</button></div></li>`).join('')}</ul>`
          : '<p class="muted" style="margin:0">Todavía no hay pagos. Usa «Registrar pago» cada vez que te devuelva algo.</p>'}
      </div>
      <div class="d-sec"><h4>Notas</h4>${d.notes ? `<div class="note-box">${esc(d.notes)}</div>` : '<p class="muted" style="margin:0">Sin notas.</p>'}</div>
    </div>
    <div class="modal-f"><button class="btn ghost" type="button" data-da="delete" style="color:var(--red)">${ICON.trash}Eliminar</button><button class="btn" type="button" data-da="edit">${ICON.edit}Editar</button><button class="btn primary" type="button" data-da="pay" ${pend ? '' : 'disabled'}>${ICON.euro}Registrar pago</button></div>`;
  el.scrollTop = scroll;
}

/* ---------- Eliminar ---------- */
function confirmDebtDelete(id, back) {
  const d = Debts.items.get(id); if (!d) return;
  const root = openLayer(`<div class="modal narrow" role="alertdialog" aria-labelledby="ddelT" aria-describedby="ddelD">
    <div class="modal-h"><h2 id="ddelT">Eliminar deuda</h2></div>
    <div class="modal-b"><p id="ddelD" style="margin:0">Vas a eliminar la deuda de <b>${esc(d.name)}</b>${d.reason ? ` (${esc(d.reason)})` : ''}: ${money(d.original)} originales, ${money(pendingOf(d))} pendientes, con todos sus pagos. Esta acción no se puede deshacer.</p></div>
    <div class="modal-f"><button class="btn ghost" type="button" data-c="no" autofocus>Cancelar</button><button class="btn danger" type="button" data-c="yes">Eliminar definitivamente</button></div></div>`,
    { onClose: back ? () => openDebtDetail(id) : null });
  root.addEventListener('click', async e => {
    const c = e.target.closest('[data-c]')?.dataset.c; if (!c) return;
    if (c === 'no') return closeLayer();
    e.target.disabled = true;
    try { await Debts.remove(id); closeLayer(); toast('Deuda eliminada'); }
    catch (err) { e.target.disabled = false; toast(errMsg(err), true); }
  });
}
function confirmPaymentDelete(id, pid) {
  const d = Debts.items.get(id); const p = d && (d.payments || []).find(x => x.id === pid); if (!p) return;
  const root = openLayer(`<div class="modal narrow" role="alertdialog" aria-labelledby="pdelT">
    <div class="modal-h"><h2 id="pdelT">Eliminar pago</h2></div>
    <div class="modal-b"><p style="margin:0">Se quitará el ${p.adjust ? 'ajuste' : 'pago'} de <b>${money(Math.abs(p.amount))}</b> del ${fmtDate(p.date)} y el pendiente de ${esc(d.name)} se recalculará.</p></div>
    <div class="modal-f"><button class="btn ghost" type="button" data-c="no" autofocus>Cancelar</button><button class="btn danger" type="button" data-c="yes">Eliminar pago</button></div></div>`,
    { onClose: () => openDebtDetail(id) });
  root.addEventListener('click', async e => {
    const c = e.target.closest('[data-c]')?.dataset.c; if (!c) return;
    if (c === 'no') return closeLayer();
    const cur = Debts.items.get(id); if (!cur) return closeLayer();
    e.target.disabled = true;
    try {
      await Debts.put(settle({ ...cur, payments: (cur.payments || []).filter(x => x.id !== pid), updatedAt: new Date().toISOString() }));
      closeLayer(); toast('Pago eliminado');
    } catch (err) { e.target.disabled = false; toast(errMsg(err), true); }
  });
}

/* ---------- Copia de las deudas (aparte de la copia de VINTED) ---------- */
function cleanDebt(x, now) {
  const pays = (Array.isArray(x.payments) ? x.payments : [])
    .filter(p => p && Number.isSafeInteger(p.amount) && p.amount !== 0 && Math.abs(p.amount) <= MAX_CENTS).slice(0, 1000)
    .map(p => ({ id: ID_RE.test(String(p.id || '')) ? p.id : rid('p'), date: DATE_RE.test(p.date) ? p.date : today(), amount: p.amount, note: txt(p.note, 120), at: txt(p.at, 40) || now, ...(p.adjust ? { adjust: true } : {}) }));
  return settle({
    id: x.id, name: txt(x.name, 80).trim().replace(/\s+/g, ' '), reason: txt(x.reason, 120).trim(), original: cents(x.original), payments: pays,
    createdOn: DATE_RE.test(x.createdOn) ? x.createdOn : today(), dueDate: DATE_RE.test(x.dueDate) ? x.dueDate : '',
    notes: txt(x.notes, 2000), paidAt: DATE_RE.test(x.paidAt) ? x.paidAt : '',
    createdAt: txt(x.createdAt, 40) || now, updatedAt: txt(x.updatedAt, 40) || now,
  });
}
function openDebtBackup() {
  const n = Debts.items.size;
  const root = openLayer(`<div class="modal narrow" role="dialog" aria-labelledby="dbkT">
    <div class="modal-h"><h2 id="dbkT">Copia de las deudas</h2><button class="icon-btn sm" type="button" data-close aria-label="Cerrar">${ICON.x}</button></div>
    <div class="modal-b">
      <p style="margin:0;color:var(--fg-2)">Descarga todas las deudas con sus pagos en un archivo, o restáuralas desde una copia anterior. Las cuentas de VINTED tienen su propia copia en su pestaña.</p>
      <div class="alert o">${ICON.shield}<p>La copia incluye nombres, importes y notas sin cifrar. Guárdala en un lugar seguro.</p></div>
    </div>
    <div class="modal-f">
      <button class="btn" type="button" data-bk="restore">Restaurar desde archivo</button>
      <button class="btn primary" type="button" data-bk="save" ${n ? '' : 'disabled'}>Descargar copia</button>
      <input type="file" id="dbkFile" accept=".json,application/json" hidden>
    </div></div>`);
  root.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) return closeLayer();
    const b = e.target.closest('[data-bk]'); if (!b) return;
    if (b.dataset.bk === 'restore') $('#dbkFile', root).click();
    if (b.dataset.bk === 'save') saveDebtBackup(b);
  });
  $('#dbkFile', root).addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) readDebtBackup(f); });
}
async function saveDebtBackup(btn) {
  btn.disabled = true;
  const text = JSON.stringify({ app: 'vinted-control-debts', format: 1, exportedAt: new Date().toISOString(), debts: [...Debts.items.values()] }, null, 2);
  const filename = `copia-deudas-${today()}.json`;
  let dl = null;
  try { dl = window.claude && await window.claude.use('downloads'); } catch { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); btn.disabled = false; toast('Copia guardada'); return; }
    catch (e) {
      if (e && e.code === 'declined') { btn.disabled = false; return; }
      if (e && e.code === 'rate_limited') { btn.disabled = false; toast('Ya hay una descarga pendiente de confirmar', true); return; }
    }
  } else {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: filename });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      btn.disabled = false; toast('Copia descargada'); return;
    } catch {}
  }
  const root = openLayer(`<div class="modal"><div class="modal-h"><h2>Copia de las deudas</h2><button class="icon-btn sm" type="button" data-close aria-label="Cerrar">${ICON.x}</button></div>
    <div class="modal-b"><p style="margin:0;color:var(--fg-2)">La descarga directa no está disponible aquí. Copia el contenido y guárdalo en un archivo <span class="mono">.json</span>.</p><textarea class="field mono" id="dbkOut" rows="10" readonly></textarea></div>
    <div class="modal-f"><button class="btn primary" type="button" id="dbkCopy">${ICON.copy}Copiar</button></div></div>`);
  $('#dbkOut', root).value = text;
  root.addEventListener('click', async e => {
    if (e.target.closest('[data-close]')) return closeLayer();
    if (e.target.closest('#dbkCopy')) {
      try { await navigator.clipboard.writeText($('#dbkOut').value); toast('Copia copiada'); }
      catch { $('#dbkOut').select(); toast('Texto seleccionado: cópialo con Ctrl+C'); }
    }
  });
}
function readDebtBackup(file) {
  if (file.size > 20 * 1024 * 1024) { toast('El archivo es demasiado grande (máx. 20 MB)', true); return; }
  const rd = new FileReader();
  rd.onload = () => {
    let data = null;
    try { data = JSON.parse(String(rd.result || '')); } catch { data = null; }
    if (!data || data.app !== 'vinted-control-debts' || !Array.isArray(data.debts)) { toast('Ese archivo no es una copia de las deudas', true); return; }
    const now = new Date().toISOString();
    const valid = data.debts.filter(x => x && typeof x === 'object' && ID_RE.test(String(x.id || '')) && typeof x.name === 'string' && x.name.trim() && cents(x.original) > 0).map(x => cleanDebt(x, now));
    const skipped = data.debts.length - valid.length;
    const root = openLayer(`<div class="modal narrow" role="alertdialog" aria-labelledby="drsT">
      <div class="modal-h"><h2 id="drsT">Restaurar deudas</h2></div>
      <div class="modal-b">
        <p style="margin:0">Se restaurarán <b>${valid.length}</b> ${valid.length === 1 ? 'deuda' : 'deudas'} de la copia del ${esc(fmtDateTime(data.exportedAt))}. Las que tengan el mismo identificador se sustituyen y las demás no se borran. Las cuentas de VINTED no se tocan.</p>
        ${skipped ? `<div class="alert o"><p>${skipped} ${skipped === 1 ? 'registro no es válido y se omitirá' : 'registros no son válidos y se omitirán'}.</p></div>` : ''}
      </div>
      <div class="modal-f"><button class="btn ghost" type="button" data-c="no">Cancelar</button><button class="btn primary" type="button" data-c="yes" ${valid.length ? '' : 'disabled'}>Restaurar</button></div></div>`);
    root.addEventListener('click', async e => {
      const c = e.target.closest('[data-c]'); if (!c) return;
      if (c.dataset.c === 'no') return closeLayer();
      c.disabled = true;
      let done = 0;
      try {
        for (const x of valid) { await Debts.put(x); done++; c.textContent = `Restaurando… ${done}/${valid.length}`; }
        closeLayer(); toast(`${done} ${done === 1 ? 'deuda restaurada' : 'deudas restauradas'}`);
      } catch (err) { c.disabled = false; c.textContent = 'Restaurar'; toast(`Se restauraron ${done} de ${valid.length}. ${errMsg(err)}`, true); }
    });
  };
  rd.onerror = () => toast('No se pudo leer el archivo', true);
  rd.readAsText(file, 'utf-8');
}

/* ---------- Eventos de DEUDAS ---------- */
function clearDebtFilters() { DUI.chip = 'all'; DUI.q = ''; $('#dq').value = ''; debtChanged(); }
$('#btnDebtAdd').addEventListener('click', () => openDebtForm());
$('#btnDebtBackup').addEventListener('click', openDebtBackup);
let dqTimer;
$('#dq').addEventListener('input', e => { clearTimeout(dqTimer); dqTimer = setTimeout(() => { DUI.q = e.target.value.trim(); renderDebtFilters(); renderDebtList(); }, 120); });
$('#dSort').addEventListener('change', e => { DUI.sort = e.target.value; debtChanged(); });
$('#dClear').addEventListener('click', clearDebtFilters);
$('#dChips').addEventListener('click', e => { const c = e.target.closest('[data-dchip]'); if (c) { DUI.chip = c.dataset.dchip; debtChanged(); } });
$('#debtKpis').addEventListener('click', e => { const k = e.target.closest('[data-dk]'); if (k) { DUI.chip = k.dataset.dk; debtChanged(); $('#dChips').scrollIntoView({ behavior: 'smooth', block: 'center' }); } });
$('#debtArea').addEventListener('click', e => {
  const b = e.target.closest('[data-da]');
  if (b) {
    const act = b.dataset.da, id = b.dataset.id;
    if (act === 'add') openDebtForm();
    else if (act === 'clear') clearDebtFilters();
    else if (act === 'pay') openPayment(id);
    else if (act === 'edit') openDebtForm(id);
    else if (act === 'delete') confirmDebtDelete(id);
    return;
  }
  if (e.target.closest('select,button,a,input')) return;
  const card = e.target.closest('[data-debt]'); if (card) openDebtDetail(card.dataset.debt);
});
$('#debtArea').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-debt]')) { e.preventDefault(); openDebtDetail(e.target.dataset.debt); }
});
renderDebtKpis(); renderDebtFilters();

renderKpis(); renderFilters();
Store.init().finally(() => Debts.init());
})();
</script>
